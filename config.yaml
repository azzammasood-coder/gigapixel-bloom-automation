# =====================================================================
# Default settings for the Gigapixel + Bloom automation.
# These are used as-is when the AI step is OFF, and as the starting
# point / guardrails when the AI step is ON.
#
# Pipeline order (Leslie's real workflow):
#   1) Bloom      -> painterly-preserving enhancement (adds pixels)
#   2) REVIEW     -> Leslie visually approves / re-runs Bloom until good
#   3) Gigapixel  -> final pass: fix aspect ratio + upscale for print
# =====================================================================

# ---- Step 1: Bloom enhancement ----
# Leslie's rule: keep the painterly brush strokes, use the LOWEST creative
# changes. "Bloom Realism" + low strength preserves detail; "Bloom Creative"
# changes the image more (avoid unless asked).
bloom:
  model: "Bloom Realism"
  strength: 0.25               # 0.01-1.0 ; low = least smoothing / most painterly
  # Faces are a known failure mode: face enhancement can re-draw eyes / shift gaze.
  # Per Leslie's "don't reshape faces" rule, this is OFF by default so Bloom cleans
  # the painting but leaves the face alone. Turn it on per-image only if wanted.
  face_enhancement: false
  face_enhancement_strength: 0.3     # only used if face_enhancement is turned on
  face_enhancement_creativity: 0.0   # 0 = stay faithful, do not re-imagine faces

# ---- Step 3: final Gigapixel pass (print prep) ----
gigapixel_final:
  model: "High Fidelity V2"    # detail-preserving upscaler
  # Upscale so the LONGEST edge reaches this many pixels, preserving the original
  # aspect ratio. 10800px long edge = 36 inch print at 300 DPI (e.g. a 2:3 image
  # becomes 7200 x 10800).
  target_long_edge_px: 10800

# ---- Output files ----
# Each approved image is saved TWICE (same pixels, two files):
#   * "Prepress"   — full print quality, high DPI  (for the printer)
#   * "Placeholder"— same size, low DPI + lighter compression (small file for web)
# Naming: "Amanda at the Flag AR 1x1" -> "Amanda at the Flag Prepress AR 1x1"
#                                     -> "Amanda at the Flag Placeholder AR 1x1"
output:
  format: "jpeg"          # jpeg | png  (Lumaprints accepts JPG/JPEG/PNG)
  prepress_tag: "Prepress"
  placeholder_tag: "Placeholder"

  # Prepress (high-res print file). Leslie's rule: 300 DPI painterly, 200 illustration.
  prepress_dpi_painterly: 300
  prepress_dpi_illustration: 200
  prepress_jpeg_quality: 95

  # Placeholder (low-res web copy) — same pixels, small file, still good quality.
  placeholder_dpi: 72
  placeholder_jpeg_quality: 70

  max_file_size_mb: 100   # Lumaprints web uploader cap (warn if exceeded)

# ---- Dropbox upload (optional) ----
# Credentials live in .env (DROPBOX_APP_KEY / DROPBOX_APP_SECRET / DROPBOX_REFRESH_TOKEN).
# When they are present, the app shows an "Upload to Dropbox" option after finishing.
dropbox:
  enabled: true
  upload_placeholder: true   # also upload the low-res Placeholder alongside Prepress

# ---- AI vision step ----
ai:
  enabled: true         # set false to always use the defaults above
  # Instructions handed to the AI when it inspects each image. This encodes
  # Leslie's preferences. Tweak freely.
  instructions: |
    This is painterly digital art (often golf scenes) that will be printed large.
    Preserve the painted look: keep brush strokes and fine detail, do NOT smooth
    them into a photo or illustration. Prefer the LOWEST creative changes.
    If the image contains human faces, be extra conservative so faces/eyes are
    not reshaped. The goal is a clean, high-resolution, print-ready image that
    still looks hand-painted.
